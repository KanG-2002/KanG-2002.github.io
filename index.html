<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONGOLIA DREAM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#faf9f5;color:#333}
header{background:white;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:bold;color:#405943;cursor:pointer}
#menuBtn{background:#405943;color:white;border:0;padding:10px 18px;font-weight:bold;font-size:15px}
button{cursor:pointer;font-family:inherit}
.ov{display:none;position:fixed;inset:0;background:#0006;z-index:15}
.ov.open{display:block}
#drawer{position:fixed;top:0;right:0;width:290px;max-width:85%;height:100%;background:white;z-index:20;transform:translateX(100%);transition:.25s;padding:55px 24px 24px;overflow:auto}
#drawer.open{transform:none}
#drawer a{display:block;padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer;font-weight:bold;color:#333}
#drawer a:hover{color:#b58b52}
#sub a{padding-left:22px;font-weight:normal;font-size:14px}
#drawer .x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:28px}
.page{display:none}.page.on{display:block}
.hidden{display:none!important}
.adminOnly{display:none}
body.admin .adminOnly{display:block}
#drawer a.adminOnly{display:none}
body.admin #drawer a.adminOnly{display:block}
body.admin #drawer #loginBtn{display:none}
body.admin [contenteditable=true]{outline:1px dashed #b58b52;cursor:text;min-width:20px;display:inline-block}
.ph{position:relative;height:200px;background:#cfd6c8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-t{color:#6b7a66;font-size:14px}
.bgph{position:absolute;inset:0;height:auto}
.up{position:absolute;right:8px;bottom:8px;background:white;border:1px solid #405943;padding:6px 10px;font-size:12px;cursor:pointer;display:none;z-index:3;color:#405943;font-weight:bold}
.bgph .up{top:12px;bottom:auto}
body.admin .up{display:block}
.hero,.banner{position:relative;display:flex;align-items:center;color:white;background:#405943;overflow:hidden}
.hero::after,.banner::after{content:'';position:absolute;inset:0;background:#0005;pointer-events:none}
.hero{height:600px;padding:10%}
.hero h1{font-size:50px}
.in,.bt{position:relative;z-index:2}
.banner{height:350px;justify-content:center;text-align:center}
.banner h1{font-size:45px;text-shadow:0 2px 8px #333}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.mainbtn{background:#b58b52;color:white;border:0;padding:15px 28px;font-size:16px}
.subbtn{background:transparent;color:white;border:2px solid white;padding:13px 26px;font-size:16px}
section{padding:65px 8%}
.heading{text-align:center;margin-bottom:40px}
.heading h2{font-size:32px;color:#405943}
.about{text-align:center;line-height:2;color:#777;max-width:750px;margin:auto}
.contact{max-width:600px;margin:35px auto;background:white;padding:25px 30px;box-shadow:0 3px 14px #0001;line-height:2}
.contact h3{margin:0 0 8px;color:#405943}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:white;cursor:pointer;box-shadow:0 5px 20px #0001}
.card .ph{height:230px}
.card .tx{padding:22px}
.card h3{color:#405943}
.card p{color:#777;line-height:1.7}
.more{color:#ae8650;font-weight:bold}
.review{background:white;padding:24px;margin:12px 0;cursor:pointer;box-shadow:0 2px 10px #0001}
.stars{color:#d3a354}
.content{max-width:950px;margin:auto;padding:45px 20px}
.content p{line-height:2;color:#777}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:30px 0}
.info div{background:#eeece4;text-align:center;padding:25px}
.back{background:#405943;color:white;padding:12px 22px;border:0;margin:15px 0}
.durs,.nums,.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0 25px}
.dur,.num{background:white;border:2px solid #405943;color:#405943;padding:12px 20px;font-weight:bold;font-size:15px}
.num{width:52px;padding:12px 0}
.dur.on,.num.on{background:#405943;color:white}
.day{display:grid;grid-template-columns:300px 1fr;gap:20px;background:white;margin:16px 0;box-shadow:0 3px 14px #0001;border-left:4px solid #b58b52}
.day .tx{padding:18px}
.day h3{margin:0 0 8px;color:#405943}
.day p{margin:0}
.inquiry{background:#eeece4;padding:30px;line-height:2;margin:15px 0}
.book{background:#b58b52;color:white;border:0;padding:14px 32px;font-size:16px;margin:15px 0}
table{width:100%;border-collapse:collapse;background:white;margin:10px 0}
th,td{padding:12px;border:1px solid #ddd;text-align:center}
th{background:#405943;color:white}
tr.total td{background:#f3e9d8;font-weight:bold;font-size:18px;color:#8a5f25}
.steps{display:flex;gap:6px;margin:15px 0 25px}
.steps span{flex:1;text-align:center;padding:10px 4px;background:#eeece4;font-size:12px;color:#777}
.steps .cur{background:#405943;color:white;font-weight:bold}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.fld label{display:block;font-size:13px;color:#555;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1px solid #ccc;font:inherit}
.full{grid-column:1/-1}
.err{border-color:#c0392b!important;background:#fff3f1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.notice{background:#fff7e6;border-left:4px solid #b58b52;padding:12px 16px;font-size:14px;color:#7a5a2a;margin:10px 0}
.agree{display:block;margin:18px 0;line-height:1.7;color:#555}
.cars{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.car{background:white;cursor:pointer;box-shadow:0 3px 14px #0001;border:3px solid transparent}
.car.on{border-color:#b58b52}
.car .tx{padding:16px}
.car h3{margin:0 0 6px;color:#405943}
.car p{margin:0;font-size:14px;line-height:1.7}
.job{background:white;padding:24px;margin:16px 0;box-shadow:0 3px 14px #0001;border-left:4px solid #405943}
.job h3{margin:8px 0;color:#405943}
.job p{margin:4px 0}
.tag{background:#eeece4;color:#8a5f25;padding:4px 10px;font-size:13px;font-weight:bold}
.bk{background:white;margin:12px 0;padding:14px 18px;box-shadow:0 2px 10px #0001}
.bk summary{cursor:pointer}
.bk td:first-child{background:#eeece4;width:35%;text-align:left}
.bk td{text-align:left}
footer{background:#263c30;color:white;text-align:center;padding:45px}
footer a{color:white;cursor:pointer;text-decoration:underline}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px;z-index:30}
.modalbox{background:white;padding:35px;max-width:500px;width:100%;max-height:90%;overflow:auto}
.close{float:right;border:0;background:none;font-size:25px}
.modalbox input{width:100%;padding:12px;border:1px solid #ccc;margin:8px 0}
@media(max-width:700px){.cards,.info,.fg,.cars{grid-template-columns:1fr}.day{grid-template-columns:1fr}.hero h1{font-size:35px}.steps span{font-size:10px}}
</style>
</head>
<body>

<div class="logo" onclick="go('home')">MONGOLIA DREAM.</div>
